spring:
  application:
    name: spring-ai
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 451MB
  mvc:
    async:
      request-timeout: 300000
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5:1.5b
        options:
          temperature: 0.3
          num-ctx: 8192
          num-predict: 1024

logging:
  level:
    com.itheima.ai: info

app:
  data-dir: ./data
  vision-model: qwen3-vl:2b-instruct
  media-python: .venv/Scripts/python.exe
